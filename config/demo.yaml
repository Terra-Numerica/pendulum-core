joystick:
  # the axis used to control the carriage in manual mode
  axis_pwm: 0
  # is the device equipped with a D-pad instead or a directional stick (default: 0)
  uses_dpad: true
  # D-pad smoothing time constant (default: 0.02 s)
  # Used to avoid brutal PWM changes, ignored if D-pad is not used
  # Can be disabled by setting tau to 0. DISCOURAGED since creates equipment wear.
  dpad_smoothing_tau_secs: 0.02
  # mode switch (manual -> LQR -> swing up)
  btn_switch: 0
  # gives control to app in LQR and swing up modes
  btn_autopilot: 2
  # comment the next line to disable the Exit button
  btn_exit: 1
  # edit and uncomment next line if you have several gamepads connected
  # device: /dev/input/js0

# communications between demo and hw_interface
# (ZeroMQ endpoints, same as in the hw_interface configuration: "ipc:///path" or "tcp://host:port")
sockets:
  # Endpoint to receive the pendulum state from hw_interface
  state_endpoint: "ipc:///tmp/pendulum_state"
  # Endpoint to send commands to hw_interface
  command_endpoint: "ipc:///tmp/pendulum_command"

# coefficients of the LQR control law
lqr_gains:
  position: -127.45880662905581
  linear_velocity: -822.638944546691
  angle: 2234.654627319883
  angular_velocity: 437.1177135919267

# coefficients of the swing-up control law
swing_up:
  k: 70
  kx: 0

misc:
  # max angle error of the LQR range (> 0, default: 0.25)
  lqr_e_theta_max: 0.25   # rd
  # width of the swing-up / LQR blending zone (>= 0, default: 0.2; 0 = immediate switch). The zone lies OUTSIDE the LQR range
  # (from lqr_e_theta_max to lqr_e_theta_max + this value): the LQR alone is applied inside the LQR range,
  # the swing-up alone beyond the blending zone
  lqr_blend_margin_angle: 0.2           # rd
  # LQR to swing-up hysteresis (> 0, default: 0.2). Once engaged, the LQR is kept until the angle error
  # exceeds lqr_e_theta_max + this value while the pendulum is moving away from the target
  # (hard limit: lqr_e_theta_max + 2 x this value)
  lqr_to_swing_up_hysteresis: 0.2       # rd
  # Control period in milliseconds (integer). Optional parameter, defaults to 20. Must match pendulum config value.
  period_ms: 20
  # Control loop trace (default: false). The last samples are kept in memory and written to a CSV file
  # when the demo exits, so that there is no disk access (nor SD card wear) while running.
  trace_enabled: true
  # duration of the trace kept in memory (> 0, default: 60 s)
  trace_duration_secs: 60
  # where the trace is written on exit (default: /tmp/pendulum_demo_trace.csv, which is in memory on most systems)
  trace_file: /tmp/pendulum_demo_trace.csv
