[tool.bumpversion]
current_version = "0.3.0"
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)"
tag = true
commit = true

[[tool.bumpversion.files]]
filename = "CMakeLists.txt"
search = 'project(pendule_pi VERSION {current_version} LANGUAGES CXX)'
replace = 'project(pendule_pi VERSION {new_version} LANGUAGES CXX)'
